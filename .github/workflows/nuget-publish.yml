name: Publish NuGet Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  PROJECT_PATH: src/TripleG3.AI.Tools.AutoGeneration/TripleG3.AI.Tools.AutoGeneration.csproj
  TEST_PROJECT_PATH: tests/TripleG3.AI.Tools.AutoGeneration.Tests/TripleG3.AI.Tools.AutoGeneration.Tests.csproj
  PACKAGE_OUTPUT_PATH: artifacts/packages
  PACKAGE_VERSION: 0.0.${{ github.run_number }}

jobs:
  publish:
    name: Build, test, package, and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.TEST_PROJECT_PATH }}

      - name: Build
        run: >-
          dotnet build ${{ env.TEST_PROJECT_PATH }}
          --configuration ${{ env.CONFIGURATION }}
          --no-restore
          /p:Version=${{ env.PACKAGE_VERSION }}
          /p:RepositoryBranch=${{ github.ref_name }}
          /p:RepositoryCommit=${{ github.sha }}
          /p:ContinuousIntegrationBuild=true

      - name: Test unit tests
        run: >-
          dotnet test ${{ env.TEST_PROJECT_PATH }}
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --verbosity normal

      - name: Pack NuGet package
        run: >-
          dotnet pack ${{ env.PROJECT_PATH }}
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --output ${{ env.PACKAGE_OUTPUT_PATH }}
          /p:PackageVersion=${{ env.PACKAGE_VERSION }}
          /p:Version=${{ env.PACKAGE_VERSION }}
          /p:RepositoryBranch=${{ github.ref_name }}
          /p:RepositoryCommit=${{ github.sha }}
          /p:ContinuousIntegrationBuild=true

      - name: Authenticate to NuGet with Trusted Publishing
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet package
        run: >-
          dotnet nuget push ${{ env.PACKAGE_OUTPUT_PATH }}/*.nupkg
          --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate